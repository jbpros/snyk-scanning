description: Every vuln in the artifact is fixed within the limit for its severity, unless .snyk ignores it
subjects:
  vuln:
    from: vulns
    identified_by: full_id
  unignored critical vuln:
    from: vuln whose ignore_expires_exists is false and severity is "critical"
  unignored high vuln:
    from: vuln whose ignore_expires_exists is false and severity is "high"
  unignored medium vuln:
    from: vuln whose ignore_expires_exists is false and severity is "medium"
  unignored low vuln:
    from: vuln whose ignore_expires_exists is false and severity is "low"
  ignored vuln:
    from: vuln whose ignore_expires_exists is true
  vuln ignored until a date:
    from: '"ignored vuln" whose ignore_forever is false'
requirements:
  readable:
    description: Every vuln has a known severity and says whether it is ignored
    subject: vuln
    min_subjects: 0
    checks:
      severity: severity is one of "critical", "high", "medium", "low"
      ignore_known: ignore_expires_exists is a boolean
  ignore_readable:
    description: Every ignored vuln says whether it is ignored forever
    subject: ignored vuln
    min_subjects: 0
    checks:
      forever_known: ignore_forever is a boolean
  critical_age:
    description: A critical vuln with no .snyk ignore is fixed within the critical limit
    subject: unignored critical vuln
    min_subjects: 0
    checks:
      seen_before_now: first_seen_ts is at most now_ts
      within_limit: first_seen_ts plus $params.max_seconds_by_severity.critical is more than now_ts
  high_age:
    description: A high vuln with no .snyk ignore is fixed within the high limit
    subject: unignored high vuln
    min_subjects: 0
    checks:
      seen_before_now: first_seen_ts is at most now_ts
      within_limit: first_seen_ts plus $params.max_seconds_by_severity.high is more than now_ts
  medium_age:
    description: A medium vuln with no .snyk ignore is fixed within the medium limit
    subject: unignored medium vuln
    min_subjects: 0
    checks:
      seen_before_now: first_seen_ts is at most now_ts
      within_limit: first_seen_ts plus $params.max_seconds_by_severity.medium is more than now_ts
  low_age:
    description: A low vuln with no .snyk ignore is fixed within the low limit
    subject: unignored low vuln
    min_subjects: 0
    checks:
      seen_before_now: first_seen_ts is at most now_ts
      within_limit: first_seen_ts plus $params.max_seconds_by_severity.low is more than now_ts
  ignore_not_expired:
    description: A .snyk ignore with an expiry date hasn't expired
    subject: vuln ignored until a date
    min_subjects: 0
    checks:
      not_expired: ignore_expires_ts is at least now_ts
